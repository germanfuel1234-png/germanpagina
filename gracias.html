<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | Rodríguez Germán</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0c 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f2f1ef;
        }
        .thankyou-card {
            background: rgba(18, 18, 21, 0.9);
            border: 1px solid rgba(242, 241, 239, 0.1);
            border-radius: 30px;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            animation: fadeUp 0.6s ease-out;
            backdrop-filter: blur(16px);
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .icon { font-size: 72px; margin-bottom: 16px; }
        h1 {
            font-size: 32px;
            color: #f2f1ef;
            margin-bottom: 12px;
        }
        .accent { color: #f4b84d; }
        p {
            color: rgba(242, 241, 239, 0.7);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .sub-text {
            color: rgba(242, 241, 239, 0.4);
            font-size: 15px;
            margin-top: 6px;
        }
        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            background: #f4b84d;
            color: #17130c;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 30px rgba(244, 184, 77, 0.3);
        }
        .social-links {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-links a {
            color: rgba(242, 241, 239, 0.5);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .social-links a:hover { color: #f4b84d; }
    </style>
</head>
<body>
    <div class="thankyou-card">
        <div class="icon">🎉</div>
        <h1>¡Mensaje <span class="accent">enviado</span>!</h1>
        <p>Gracias por contactarme, <strong>Germán</strong> te responderá a la brevedad.</p>
        <p class="sub-text">📩 Revisá tu correo para confirmar recepción</p>
        
        <a href="/" class="btn-back">← Volver al inicio</a>
        
        <div class="social-links">
            <a href="https://wa.me/5491136239969" target="_blank">💬 WhatsApp</a>
            <a href="mailto:germanty123@gmail.com">📧 germanty123@gmail.com</a>
        </div>
    </div>
</body>
</html>
