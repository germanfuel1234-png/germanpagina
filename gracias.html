    <title>¡Gracias! | Rodríguez Germán — Desarrollo Web</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #121215;
            --fg: #f2f1ef;
            --muted: rgba(242, 241, 239, 0.62);
            --border: rgba(242, 241, 239, 0.10);
            --accent: oklch(80% 0.13 75);
            --accent-dim: oklch(80% 0.13 75 / 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 56px 32px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        .icon-check {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            font-size: 28px;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
        }

        p {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .back-home {
            display: inline-block;
            padding: 12px 28px;
            background: var(--accent);
            color: #17130c;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .back-home:hover {
            opacity: 0.88;
        }

        @media (max-width: 480px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-check" aria-hidden="true">✓</div>
        <h1>¡Gracias!</h1>
        <p>Tu mensaje se envió correctamente.<br>Te respondo a la brevedad.</p>
        <a class="back-home" href="index.html">← Volver al inicio</a>
    </div>
</body>
